[project]
name = "researchpaper-ai"
version = "1.0.0"
description = "A session-isolated research-paper assistant with Gemini, PDF retrieval, OCR, and page citations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "python-multipart>=0.0.12,<0.1.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-genai>=2.28.0,<3.0.0",
    "langchain-core>=0.3.15,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langchain-community>=0.3.5,<0.4.0",
    "faiss-cpu>=1.9.0,<2.0.0",
    "pypdf>=5.0.1,<6.0.0",
    "PyMuPDF>=1.24.0,<2.0.0",
    "SQLAlchemy>=2.0.35,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", "logs", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic.

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
